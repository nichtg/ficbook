<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Ficbook - Login & Register</title>
    <script src="https://cdn.tailwindcss.com"></script>
  </head>
  <body class="bg-gray-50">
    <!-- Navigation -->
    <nav class="bg-gradient-to-r from-red-700 to-red-800 text-white">
      <div class="max-w-6xl px-4 py-4">
        <a href="/" class="text-2xl font-bold hover:text-red-200 transition"
          >📖 Ficbook</a
        >
      </div>
    </nav>

    <!-- Toast -->
    {% if message and status == 200 %}
    <div
      id="toast"
      class="fixed top-1/4 left-1/2 z-[60] w-[calc(100%-2rem)] max-w-sm -translate-x-1/2 rounded-2xl border border-emerald-200 bg-gradient-to-br from-emerald-50 via-white to-green-50 p-4 shadow-xl shadow-emerald-100/70 transition-all duration-500"
    >
      <div class="flex items-start gap-3">
        <div
          class="mt-0.5 flex h-9 w-9 shrink-0 items-center justify-center rounded-full bg-emerald-600 text-white"
        >
          <svg
            xmlns="http://www.w3.org/2000/svg"
            viewBox="0 0 20 20"
            fill="currentColor"
            class="size-5"
          >
            <path
              fill-rule="evenodd"
              d="M16.704 4.153a.75.75 0 0 1 .143 1.052l-6.5 7.5a.75.75 0 0 1-1.086.04l-3.5-3.5a.75.75 0 1 1 1.06-1.06l2.928 2.928 5.968-6.89a.75.75 0 0 1 1.052-.143Z"
              clip-rule="evenodd"
            />
          </svg>
        </div>
        <div>
          <p class="font-semibold text-emerald-900">Success</p>
          <p class="text-sm leading-5 text-gray-700">{{ message }}</p>
        </div>
      </div>
    </div>
    {% elif message and status in [400, 401, 404, 403] %}
    <div
      id="toast"
      class="fixed top-1/4 left-1/2 z-[60] w-[calc(100%-2rem)] max-w-sm -translate-x-1/2 rounded-2xl border border-red-200 bg-gradient-to-br from-red-50 via-white to-red-50 p-4 shadow-xl shadow-red-100/70 transition-all duration-500"
    >
      <div class="flex items-start gap-3">
        <div
          class="mt-0.5 flex h-9 w-9 shrink-0 items-center justify-center rounded-full bg-red-600 text-white"
        >
          <svg
            xmlns="http://www.w3.org/2000/svg"
            viewBox="0 0 20 20"
            fill="currentColor"
            class="size-5"
          >
            <path
              fill-rule="evenodd"
              d="M18 10a8 8 0 1 1-16 0 8 8 0 0 1 16 0Zm-8-5a.75.75 0 0 1 .75.75v4.5a.75.75 0 0 1-1.5 0v-4.5A.75.75 0 0 1 10 5Zm0 10a1 1 0 1 0 0-2 1 1 0 0 0 0 2Z"
              clip-rule="evenodd"
            />
          </svg>
        </div>
        <div>
          <p class="font-semibold text-red-900">Error</p>
          <p class="text-sm leading-5 text-gray-700">{{ message }}</p>
        </div>
      </div>
    </div>
    {% endif %}

    <!-- Main Container -->
    <div class="min-h-screen flex items-center justify-center px-4 py-12">
      <div class="w-full max-w-md">
        <!-- Card -->
        <div class="bg-white rounded-lg shadow-lg overflow-hidden">
          <!-- Tabs -->
          <div class="flex border-b border-gray-200">
            <button
              id="login-tab"
              class="flex-1 py-4 px-6 text-center font-semibold text-red-700 border-b-2 border-red-700 bg-red-50 transition cursor-pointer"
              onclick="switchTab('login')"
            >
              Login
            </button>
            <button
              id="register-tab"
              class="flex-1 py-4 px-6 text-center font-semibold text-gray-600 border-b-2 border-transparent hover:text-gray-900 transition cursor-pointer"
              onclick="switchTab('register')"
            >
              Register
            </button>
          </div>

          <!-- Login Form -->
          <div id="login-form" class="p-8">
            <h2 class="text-2xl font-bold text-gray-900 mb-6">Welcome Back</h2>
            <form
              class="space-y-4"
              name="login-form"
              method="POST"
              action="/login-form"
            >
              <div>
                <label
                  for="login-email"
                  class="block text-sm font-medium text-gray-700 mb-1"
                  >Email</label
                >
                <input
                  type="text"
                  name="login-email"
                  placeholder="Enter your email"
                  class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-red-700 focus:border-transparent outline-none transition"
                  required
                />
              </div>

              <div>
                <label
                  for="login-password"
                  class="block text-sm font-medium text-gray-700 mb-1"
                  >Password</label
                >
                <input
                  type="password"
                  name="login-password"
                  placeholder="Enter your password"
                  class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-red-700 focus:border-transparent outline-none transition"
                  required
                />
              </div>

              <button
                type="submit"
                class="w-full bg-red-700 hover:bg-red-800 text-white font-semibold py-2 px-4 rounded-lg transition mt-6"
              >
                Login
              </button>

              <p class="text-center text-sm text-gray-600 mt-4">
                Don't have an account?
                <button
                  type="button"
                  onclick="switchTab('register')"
                  class="text-red-700 hover:text-red-800 font-semibold transition"
                >
                  Register here
                </button>
              </p>
            </form>
          </div>

          <!-- Register Form -->
          <div id="register-form" class="p-8 hidden">
            <h2 class="text-2xl font-bold text-gray-900 mb-6">
              Create Account
            </h2>
            <form
              class="space-y-4"
              name="register-form"
              method="POST"
              action="/register-form"
            >
              <div>
                <label
                  for="register-email"
                  class="block text-sm font-medium text-gray-700 mb-1"
                  >Email</label
                >
                <input
                  type="email"
                  name="register-email"
                  placeholder="Enter your email"
                  class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-red-700 focus:border-transparent outline-none transition"
                  required
                />
              </div>

              <div>
                <label
                  for="register-password"
                  class="block text-sm font-medium text-gray-700 mb-1"
                  >Password</label
                >
                <input
                  type="password"
                  name="register-password"
                  placeholder="Create a password"
                  minlength="8"
                  class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-red-700 focus:border-transparent outline-none transition"
                  required
                />
                <p class="text-xs text-gray-500 mt-1">At least 8 characters</p>
              </div>

              <button
                type="submit"
                class="w-full bg-red-700 hover:bg-red-800 text-white font-semibold py-2 px-4 rounded-lg transition mt-6"
              >
                Create Account
              </button>

              <p class="text-center text-sm text-gray-600 mt-4">
                Already have an account?
                <button
                  type="button"
                  onclick="switchTab('login')"
                  class="text-red-700 hover:text-red-800 font-semibold transition"
                >
                  Login here
                </button>
              </p>
            </form>
          </div>
        </div>
      </div>
    </div>

    <script>
      function switchTab(tab) {
        const loginForm = document.getElementById("login-form");
        const registerForm = document.getElementById("register-form");
        const loginTab = document.getElementById("login-tab");
        const registerTab = document.getElementById("register-tab");

        if (tab === "login") {
          loginForm.classList.remove("hidden");
          registerForm.classList.add("hidden");
          loginTab.classList.add(
            "bg-red-50",
            "border-b-red-700",
            "text-red-700",
          );
          loginTab.classList.remove(
            "bg-white",
            "border-b-transparent",
            "text-gray-600",
          );
          registerTab.classList.add(
            "bg-white",
            "border-b-transparent",
            "text-gray-600",
          );
          registerTab.classList.remove(
            "bg-red-50",
            "border-b-red-700",
            "text-red-700",
          );
        } else {
          loginForm.classList.add("hidden");
          registerForm.classList.remove("hidden");
          registerTab.classList.add(
            "bg-red-50",
            "border-b-red-700",
            "text-red-700",
          );
          registerTab.classList.remove(
            "bg-white",
            "border-b-transparent",
            "text-gray-600",
          );
          loginTab.classList.add(
            "bg-white",
            "border-b-transparent",
            "text-gray-600",
          );
          loginTab.classList.remove(
            "bg-red-50",
            "border-b-red-700",
            "text-red-700",
          );
        }
      }

      const toast = document.getElementById("toast");
      if (toast) {
        setTimeout(() => {
          toast.classList.add("opacity-0", "translate-y-2", "brightness-110");
          setTimeout(() => toast.remove(), 500);
        }, 3000);
      }
    </script>
  </body>
</html>
